# GENERATED by `make render MODEL=qwen3-8b-awq TOPO=sliced` (serving/profiles.py). Edit deploy/models/qwen3-8b-awq.json or
# deploy/serving.json, not this file. The committed deploy/k8s/vllm.yaml is the default pair; a test keeps it in sync.
#
# vLLM workers: a StatefulSet so each worker has a stable name (vllm-0, vllm-1) the gateway can pick by; a headless
# Service gives each one DNS (vllm-0.vllm.default.svc). Cluster-internal only: no hostPort, no NodePort, no
# LoadBalancer. Reach it with `make tunnel`.
#
# Model qwen3-8b-awq: Current model (D-16): dense, standard attention, official AWQ 4-bit, hermes tool format.
# Topology sliced: N workers on HAMi slices of 20 GiB and half the SMs each: GPU slicing, routing, affinity and the KV hop between workers.
# Each replica gets 20,480 MiB and 50 % of the SMs through HAMi; at most 2 replica(s). Start with 1;
# `make scale N=...` adds workers. Fit: `make fit MODEL=qwen3-8b-awq TOPO=sliced`.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  clusterIP: None
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  labels: {app: vllm, doctor.serving/model: qwen3-8b-awq, doctor.serving/topology: sliced}
spec:
  serviceName: vllm
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm, doctor.serving/model: qwen3-8b-awq, doctor.serving/topology: sliced}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      schedulerName: hami-scheduler
      terminationGracePeriodSeconds: 30
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2
          imagePullPolicy: IfNotPresent
          args:
            - --model=Qwen/Qwen3-8B-AWQ
            - --revision=4da05a8edb55c6046cce958586c33b61da07bb79
            - --served-model-name=Qwen/Qwen3-8B-AWQ
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=24576          # audits reach ~15k tokens (D-29 amended); KV is allocated on demand
            - --gpu-memory-utilization=0.9       # of what HAMi exposes to the pod: the slice, or the whole card
            - --max-num-seqs=32
            - --max-num-batched-tokens=8192
            - --enable-prefix-caching
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
            - --enable-prompt-tokens-details   # usage.prompt_tokens_details.cached_tokens per request
            - --enable-request-id-headers      # echo X-Request-Id so traces join across hops
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}          # weights are fetched by `make prefetch`; never download at serve time
            - {name: HF_HOME, value: /root/.cache/huggingface}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            limits:
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "20480"     # MiB of the A100's 40960
              nvidia.com/gpucores: "50"      # percent of SMs
          startupProbe:                      # load + CUDA graph capture can take minutes
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: hf-cache
          hostPath: {path: /opt/hf-cache, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
