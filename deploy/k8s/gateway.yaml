# The inference gateway (C11, D-42) in front of the vLLM workers. `make gateway-image` builds gateway/Dockerfile for
# amd64 and arm64, pushes it to Docker Hub (public, so the node pulls without credentials) and pins its digest below.
# `make gateway` records the warm-up body into the gateway-warmup ConfigMap and applies this file. Cluster-internal
# only: a ClusterIP Service, reached with `make tunnel` (svc/gateway). Prometheus scrapes its orch_* metrics through
# the same annotations as vLLM. The gateway is a StatefulSet so each replica keeps its pebble state directory
# (design/state-backend.md) on its own PersistentVolumeClaim across restarts and reschedules.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  replicas: 1                      # the queue and reservations are per replica; sharding runs across replicas is phase 3
  serviceName: gateway
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false     # the gateway never talks to the Kubernetes API
      terminationGracePeriodSeconds: 130      # lets an in-flight call finish under the client's 120 s timeout
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}   # fsGroup: the state volume is writable by the gateway
      containers:
        - name: gateway
          image: docker.io/cdugga/cluster-doctor-gateway@sha256:a0b7c8a5832c0bad3ec4c074b2c9828a2bf223cf00990beb7f6f9d3275f91c5a   # make gateway-image rewrites this line
          imagePullPolicy: IfNotPresent
          env:
            - {name: GW_LISTEN, value: ":8000"}
            - {name: GW_WARM_BODY, value: /etc/gateway/warm.json}
            - {name: GW_STATE, value: pebble}                  # memory loses the run table and tenant balances on every restart
            - {name: GW_STATE_DIR, value: /var/lib/gateway}
            - {name: GW_POLICY, value: prefix_then_load}     # make gateway POLICY=least_loaded for the A/B control arm
            - {name: GW_POOL, value: sliced}
            # GW_WORKERS defaults to vllm-0 and vllm-1 on the headless vllm Service; an absent vllm-1 is just Down.
            # Overflow to Superlinked (D-53, design/overflow.md): off until the key arrives. The key comes from the
            # gateway-overflow Secret, which does not exist until someone creates it:
            #   kubectl create secret generic gateway-overflow --from-literal=api-key=<key>
            #   make gateway OVERFLOW=1            # or: kubectl set env deployment/gateway GW_OVERFLOW=true
            # A restricted request never leaves whatever these say; the backend is probed and falls back to the 503.
            - {name: GW_OVERFLOW, value: "false"}
            - {name: GW_OVERFLOW_BASE_URL, value: https://api.superlinked.com}
            - {name: GW_OVERFLOW_MODEL, value: Qwen/Qwen3.8-27B-FP8}   # what their API served on 10-04 (F22); confirm with GET /v1/models
            - {name: GW_OVERFLOW_TIMEOUT, value: 60s}
            - {name: GW_OVERFLOW_PROBE_INTERVAL, value: 30s}
            - {name: GW_OVERFLOW_MAX_INFLIGHT, value: "4"}
            - name: GW_OVERFLOW_API_KEY
              valueFrom:
                secretKeyRef: {name: gateway-overflow, key: api-key, optional: true}   # optional: the pod starts without the Secret
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          readinessProbe:                   # ready once any worker has passed warm-up
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          volumeMounts:
            - {name: warmup, mountPath: /etc/gateway, readOnly: true}
            - {name: state, mountPath: /var/lib/gateway}
      volumes:
        - name: warmup
          configMap: {name: gateway-warmup}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}      # the store holds one small JSON value per tenant, run and worker
