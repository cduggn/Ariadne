# The inference gateway (C11, D-42) in front of the vLLM workers. `make gateway` builds the static binary, installs it
# at /opt/gateway/gateway on the node, records the warm-up body into the gateway-warmup ConfigMap and applies this
# file. The binary comes from hostPath into a pinned distroless image, the way the weights come from the host cache,
# so no registry is needed. Cluster-internal only: a ClusterIP Service, reached with `make tunnel` (svc/gateway).
# Prometheus scrapes its orch_* metrics through the same annotations as vLLM.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: {app: gateway}
spec:
  replicas: 1                      # the run table and the queue live in memory; a second replica would split them
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false     # the gateway never talks to the Kubernetes API
      terminationGracePeriodSeconds: 130      # lets an in-flight call finish under the client's 120 s timeout
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: gateway
          image: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
          imagePullPolicy: IfNotPresent
          command: [/opt/gateway/gateway]
          env:
            - {name: GW_LISTEN, value: ":8000"}
            - {name: GW_WARM_BODY, value: /etc/gateway/warm.json}
            - {name: GW_POLICY, value: prefix_then_load}     # make gateway POLICY=least_loaded for the A/B control arm
            - {name: GW_POOL, value: sliced}
            # GW_WORKERS defaults to vllm-0 and vllm-1 on the headless vllm Service; an absent vllm-1 is just Down.
          ports:
            - {name: http, containerPort: 8000}
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          readinessProbe:                   # ready once any worker has passed warm-up
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 5
          volumeMounts:
            - {name: bin, mountPath: /opt/gateway, readOnly: true}
            - {name: warmup, mountPath: /etc/gateway, readOnly: true}
      volumes:
        - name: bin
          hostPath: {path: /opt/gateway, type: Directory}
        - name: warmup
          configMap: {name: gateway-warmup}
