#cloud-config
# Node bootstrap for one Lambda GPU node: k3s + HAMi, vLLM image pre-pulled, OpenCost for same-day cluster cost (D-26).
# One file for every GPU we rent. `make up` (lab/up.sh) picks the first type with capacity; this script then reads the
# hardware and fetches that GPU's boot model before ready.json and its next model in the background (D-40). It deploys no
# workload; `make deploy` applies deploy/k8s/ after this.
#
# Launch:   make up      (tries TYPES in order; see lab/up.sh)
# Progress: lam logs          Done marker: /var/lib/bootstrap/ready.json
# Re-run:   sudo bash /opt/bootstrap/bootstrap.sh     (idempotent: every step checks before acting)
#
# No secrets in here, because Lambda stores user_data with the instance metadata. The model is ungated,
# so no HF token is needed.

write_files:
  - path: /opt/bootstrap/bootstrap.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      # ---- pins (change here, nowhere else) ----------------------------------------------
      K3S_VERSION="v1.36.4+k3s1"            # stable channel 2026-09-23; install.sh verifies the binary sha256
      HELM_VERSION="v3.22.0"
      HAMI_CHART_VERSION="2.9.0"            # the version the class stack ran on Lambda
      PROMETHEUS_CHART_VERSION="29.33.0"    # prometheus-community/prometheus, app v3.14.0
      GRAFANA_CHART_VERSION="13.2.5"        # grafana-community/grafana (grafana/grafana chart is deprecated)
      OPENCOST_CHART_VERSION="2.5.32"       # opencost/opencost, app 1.121.3 (2026-09-21)
      KEDA_CHART_VERSION="2.21.0"           # kedacore/keda, app 2.21.0 (2026-09-23); scales vLLM only after `make autoscale` (D-49)
      DCGM_IMAGE="nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04"
      VLLM_IMAGE="docker.io/vllm/vllm-openai:v0.29.0-cu129@sha256:7ef5a35d1ef8ce2cf9d671dd91eec6e367c5849262e0362b4d3d4a26be0d87d2"
      HF_CACHE="/opt/hf-cache"              # hostPath the vLLM pods mount read-only

      # ---- hardware: the only per-machine part ------------------------------------------------
      # The GPU class and its models are copies of deploy/serving.json gpus.<class>.boot and the profiles in
      # deploy/models/ (tests/test_serving.py keeps them equal). MODEL is fetched before ready.json; NEXT_MODEL in the
      # background after it. Other models: `make prefetch`.
      GPU_MIB=$(nvidia-smi --query-gpu=memory.total --format=csv,noheader,nounits | head -1 | tr -d ' ')
      if   [ "$GPU_MIB" -lt 60000 ]; then GPU=a100-40
      elif [ "$GPU_MIB" -lt 90000 ]; then GPU=h100-80
      else GPU=gh200-96; fi
      case "$GPU" in
        a100-40) MODEL="Qwen/Qwen3-8B-AWQ" MODEL_REVISION="4da05a8edb55c6046cce958586c33b61da07bb79" NEXT_MODEL="Qwen/Qwen3.8-27B-FP8" NEXT_MODEL_REVISION="017b9c7af6b5689d5dd426a76e0bc077eb5ca20a" ;;
        h100-80|gh200-96) MODEL="Qwen/Qwen3.8-27B-FP8" MODEL_REVISION="017b9c7af6b5689d5dd426a76e0bc077eb5ca20a" NEXT_MODEL="RedHatAI/gemma-4-31B-it-FP8-dynamic" NEXT_MODEL_REVISION="d4ab4f579dd3516f97d8a6a4c98d0653480bad15" ;;
      esac
      case "$(uname -m)" in
        x86_64)  ARCH=amd64 HELM_SHA256="1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb" ;;
        aarch64) ARCH=arm64 HELM_SHA256="f14e804dfee240f55525b667488fe9adca349e63e00c9af634c0beb1421ac310" ;;
        *) echo "no bootstrap for $(uname -m)"; exit 1 ;;
      esac
      # -------------------------------------------------------------------------------------

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      MARK=/var/lib/bootstrap; mkdir -p "$MARK" "$HF_CACHE"
      step() { echo "== $(date -u +%H:%M:%S) $*"; }

      step "GPU and container runtime"
      nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader
      if ! command -v nvidia-container-runtime >/dev/null; then
        step "nvidia-container-runtime missing; installing nvidia-container-toolkit"
        apt-get update -qq && apt-get install -y -qq nvidia-container-toolkit
      fi

      step "k3s $K3S_VERSION"
      if ! k3s --version 2>/dev/null | grep -qF "$K3S_VERSION"; then
        curl -sfL "https://raw.githubusercontent.com/k3s-io/k3s/${K3S_VERSION/+/%2B}/install.sh" |
          INSTALL_K3S_VERSION="$K3S_VERSION" \
          INSTALL_K3S_EXEC="--default-runtime nvidia --disable traefik --disable servicelb --write-kubeconfig-mode 600" sh -
      fi
      until kubectl get nodes 2>/dev/null | grep -q " Ready"; do sleep 5; done
      install -d -o ubuntu -g ubuntu /home/ubuntu/.kube
      install -m 600 -o ubuntu -g ubuntu "$KUBECONFIG" /home/ubuntu/.kube/config
      # k3s's bundled kubectl defaults to the root-only /etc/rancher/k3s/k3s.yaml; non-interactive ssh
      # sessions (make deploy, make kv …) read /etc/environment too, so point every login at the user copy.
      grep -q '^KUBECONFIG=' /etc/environment || echo 'KUBECONFIG=/home/ubuntu/.kube/config' >> /etc/environment

      step "helm $HELM_VERSION"
      if ! helm version --short 2>/dev/null | grep -qF "$HELM_VERSION"; then
        tmp=$(mktemp -d)
        curl -sfLo "$tmp/helm.tgz" "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz"
        echo "$HELM_SHA256  $tmp/helm.tgz" | sha256sum -c -
        tar -xzf "$tmp/helm.tgz" -C "$tmp" && install -m 755 "$tmp/linux-${ARCH}/helm" /usr/local/bin/helm
        rm -rf "$tmp"
      fi

      step "HAMi $HAMI_CHART_VERSION"
      NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
      kubectl label node "$NODE" gpu=on --overwrite
      K8S_VERSION=$(kubectl version -o json | python3 -c 'import json,sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"].split("+")[0])')
      helm repo add hami-charts https://project-hami.github.io/HAMi/ >/dev/null
      helm upgrade --install hami hami-charts/hami --version "$HAMI_CHART_VERSION" -n kube-system \
        --set scheduler.kubeScheduler.image.registry=registry.k8s.io \
        --set scheduler.kubeScheduler.image.repository=kube-scheduler \
        --set "scheduler.kubeScheduler.image.tag=$K8S_VERSION" \
        --set "scheduler.kubeScheduler.imageTag=$K8S_VERSION" \
        --set devicePlugin.deviceSplitCount=4 \
        --wait --timeout 10m
      # Bounded: if HAMi cannot register this GPU (untested on GH200), fail now rather than bill a node stuck at boot.
      for _ in $(seq 60); do
        kubectl get node "$NODE" -o jsonpath='{.status.allocatable.nvidia\.com/gpu}' | grep -q '[1-9]' && break
        sleep 5
      done
      kubectl get node "$NODE" -o jsonpath='{.status.allocatable.nvidia\.com/gpu}' | grep -q '[1-9]' ||
        { echo "HAMi registered no GPU on $GPU after 5 min: make down, then make up TYPES=gpu_1x_a100_sxm4"; exit 1; }

      step "observability: Prometheus $PROMETHEUS_CHART_VERSION, Grafana $GRAFANA_CHART_VERSION, DCGM exporter"
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
      helm repo add grafana-community https://grafana-community.github.io/helm-charts >/dev/null
      helm upgrade --install prometheus prometheus-community/prometheus --version "$PROMETHEUS_CHART_VERSION" \
        -n monitoring --create-namespace -f /opt/bootstrap/prometheus-values.yaml --wait --timeout 10m
      helm upgrade --install grafana grafana-community/grafana --version "$GRAFANA_CHART_VERSION" \
        -n monitoring -f /opt/bootstrap/grafana-values.yaml --wait --timeout 10m
      sed "s|__DCGM_IMAGE__|$DCGM_IMAGE|" /opt/bootstrap/dcgm-exporter.yaml | kubectl apply -f -
      kubectl -n monitoring rollout status daemonset/dcgm-exporter --timeout=10m

      step "KEDA $KEDA_CHART_VERSION (installed idle; make autoscale applies the ScaledObject)"
      helm repo add kedacore https://kedacore.github.io/charts >/dev/null
      helm upgrade --install keda kedacore/keda --version "$KEDA_CHART_VERSION" \
        -n keda --create-namespace --wait --timeout 10m

      step "OpenCost $OPENCOST_CHART_VERSION (reads the in-cluster Prometheus; custom A100 pricing)"
      helm repo add opencost https://opencost.github.io/opencost-helm-chart >/dev/null
      helm upgrade --install opencost opencost/opencost --version "$OPENCOST_CHART_VERSION" \
        -n opencost --create-namespace -f /opt/bootstrap/opencost-values.yaml --wait --timeout 10m

      step "pull $VLLM_IMAGE (~10 GB)"
      k3s ctr -n k8s.io images pull "$VLLM_IMAGE" >/dev/null

      fetch() {  # repo revision
        [ -f "$MARK/model-$2" ] && return 0
        k3s ctr -n k8s.io run --rm --net-host \
          --mount "type=bind,src=$HF_CACHE,dst=/root/.cache/huggingface,options=rbind:rw" \
          "$VLLM_IMAGE" "hf-fetch-$2" \
          python3 -c "from huggingface_hub import snapshot_download as d; print(d('$1', revision='$2'))"
        touch "$MARK/model-$2"
      }

      step "fetch $MODEL@$MODEL_REVISION"
      fetch "$MODEL" "$MODEL_REVISION"

      python3 - "$MARK/ready.json" <<EOF
      import json, subprocess, sys
      drv = subprocess.run(["nvidia-smi", "--query-gpu=name,driver_version", "--format=csv,noheader"], capture_output=True, text=True).stdout.strip()
      json.dump({"k3s": "$K3S_VERSION", "helm": "$HELM_VERSION", "hami": "$HAMI_CHART_VERSION", "vllm_image": "$VLLM_IMAGE",
                 "prometheus_chart": "$PROMETHEUS_CHART_VERSION", "grafana_chart": "$GRAFANA_CHART_VERSION", "dcgm_image": "$DCGM_IMAGE",
                 "opencost_chart": "$OPENCOST_CHART_VERSION", "keda_chart": "$KEDA_CHART_VERSION",
                 "gpu": "$GPU", "gpu_mib": $GPU_MIB, "arch": "$ARCH",
                 "model": "$MODEL", "revision": "$MODEL_REVISION", "next_model": "$NEXT_MODEL", "gpu_driver": drv}, open(sys.argv[1], "w"), indent=2)
      EOF
      step "ready: $(cat "$MARK/ready.json" | tr -d '\n ')"

      # Detached with its own log, so cloud-init (and lam launch) finish now rather than after the download.
      step "background fetch $NEXT_MODEL@$NEXT_MODEL_REVISION → /var/log/prefetch.log"
      export -f fetch; export MARK HF_CACHE VLLM_IMAGE
      setsid nohup bash -c "fetch '$NEXT_MODEL' '$NEXT_MODEL_REVISION' && echo done" \
        > /var/log/prefetch.log 2>&1 < /dev/null &

  # ---- observability config (installed once per node; dashboards come later via `make dashboards`) ----
  - path: /opt/bootstrap/prometheus-values.yaml
    permissions: "0644"
    content: |
      server:
        persistentVolume: {enabled: false}      # metrics die with the node; export what you need with `make metrics`
        retention: 2d
        global: {scrape_interval: 5s, scrape_timeout: 4s, evaluation_interval: 5s}
      # The chart's default kubernetes-pods job scrapes any pod annotated prometheus.io/scrape=true (vLLM, DCGM).
      extraScrapeConfigs: |
        - job_name: hami
          static_configs:
            - targets:
                - hami-device-plugin-monitor.kube-system.svc.cluster.local:31992
                - hami-scheduler.kube-system.svc.cluster.local:31993
      # Alert rules: a verbatim copy of deploy/observability/alerts.yaml from `groups:` on (tests/test_serving.py
      # keeps them equal). Alertmanager is off; firing alerts show on Prometheus's Alerts page (D-45).
      serverFiles:
        alerting_rules.yml:
          groups:
            - name: cluster-doctor-scaling
              rules:
                # Requests that want a worker right now: in flight on one, or waiting in the gateway's queue for one.
                # KEDA divides it by the per-worker in-flight cap (GW_MAX_INFLIGHT, D-43), so it reads as workers needed.
                - record: doctor:vllm_demand_requests
                  expr: (sum(orch_replica_active_requests) + sum(orch_replica_queue_depth)) or vector(0)
                # Refusals that another worker would have prevented, per minute. tenant_tokens is a quota, not capacity.
                - record: doctor:gateway_capacity_sheds_per_minute
                  expr: (sum(rate(orch_shed_total{reason=~"kv_free|queue_full|timeout_queue|no_eligible_pod|p99_spread"}[2m])) * 60) or vector(0)

            - name: cluster-doctor-serving
              rules:
                - alert: KVCacheSaturated
                  expr: max by (pod) (vllm:kv_cache_usage_perc) > 0.8
                  for: 5m
                  labels: {severity: warning}
                  annotations:
                    summary: "{{ $labels.pod }}: KV cache above the gateway's 0.80 shed line for 5 minutes"
                    action: "New runs are being shed (orch_shed_total{reason=kv_free}). Check the in-flight cap (GW_MAX_INFLIGHT, D-43) against the worker's KV pool (make kv)."

                - alert: GatewayQueueWaitHigh
                  expr: histogram_quantile(0.95, sum by (le) (rate(orch_request_duration_seconds_bucket{stage="queue"}[5m]))) > 5
                  for: 5m
                  labels: {severity: warning}
                  annotations:
                    summary: "Gateway queue wait p95 above 5 s, half the 10 s interactive deadline, for 5 minutes"
                    action: "Requests are close to timing out in the queue (orch_shed_total{reason=timeout_queue}). Add a worker, or check whether the in-flight cap is too strict (F36)."

                - alert: VLLMPreempting
                  expr: sum by (pod) (rate(vllm:num_preemptions_total[5m])) > 0
                  for: 5m
                  labels: {severity: warning}
                  annotations:
                    summary: "{{ $labels.pod }}: vLLM has been preempting requests for 5 minutes"
                    action: "Admission is letting in more than the worker's KV holds; preempted requests recompute their prompts. Lower GW_MAX_INFLIGHT (D-43)."

                - alert: DoctorInconclusiveRateHigh
                  expr: >
                    sum(increase(doctor_diagnoses_total{status="inconclusive"}[1h]))
                      / sum(increase(doctor_diagnoses_total[1h])) > 0.2
                  for: 15m
                  labels: {severity: warning}
                  annotations:
                    summary: "More than 20% of the doctor's diagnoses in the last hour were inconclusive"
                    action: "About twice the measured rate. Check the gateway's refusals (refused steps that ran out of retries end inconclusive or undiagnosed) and the model's step budget."

                - alert: RestrictedRequestOffBox
                  expr: increase(orch_restricted_offbox_total[5m]) > 0
                  labels: {severity: critical}
                  annotations:
                    summary: "A restricted request was routed off the box"
                    action: "This breaks the data-class invariant. Stop overflow (unset the overflow backend) and audit the gateway's request log for class=restricted with overflow set."

      alertmanager: {enabled: false}
      prometheus-pushgateway: {enabled: false}
      kube-state-metrics: {enabled: true}
      prometheus-node-exporter: {enabled: true}
  - path: /opt/bootstrap/grafana-values.yaml
    permissions: "0644"
    content: |
      persistence: {enabled: false}
      service: {type: ClusterIP}               # reached only through `make grafana` (ssh + port-forward)
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://prometheus-server.monitoring.svc.cluster.local:80
              access: proxy
              isDefault: true
  - path: /opt/bootstrap/dcgm-exporter.yaml
    permissions: "0644"
    content: |
      # GPU-level metrics for the whole A100 (not per HAMi slice). No GPU resource request, so it
      # does not take a HAMi slot; NVIDIA_VISIBLE_DEVICES=all and the nvidia default runtime give it
      # the device. No hostNetwork/hostPort: Prometheus scrapes the pod IP.
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: dcgm-exporter, namespace: monitoring}
      spec:
        selector: {matchLabels: {app: dcgm-exporter}}
        template:
          metadata:
            labels: {app: dcgm-exporter}
            annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9400", prometheus.io/path: /metrics}
          spec:
            containers:
              - name: exporter
                image: __DCGM_IMAGE__
                env: [{name: NVIDIA_VISIBLE_DEVICES, value: all}]
                ports: [{containerPort: 9400, name: metrics}]
                securityContext: {capabilities: {add: [SYS_ADMIN]}}   # needed for profiling (SM activity) metrics

  - path: /opt/bootstrap/opencost-values.yaml
    permissions: "0644"
    content: |
      # Same-day cluster cost (D-26). ClusterIP only; read by the doctor's cost_report tool via port-forward.
      opencost:
        prometheus:
          internal:
            enabled: true
            serviceName: prometheus-server
            namespaceName: monitoring
            port: 80
        customPricing:
          enabled: true
          provider: custom
          costModel:
            description: Lambda on demand, A100 40 GB price — whole instance priced on the GPU (verify units on first boot; H100/GH200 cost more)
            CPU: 0
            spotCPU: 0
            RAM: 0
            spotRAM: 0
            GPU: 1.99
            storage: 0
            zoneNetworkEgress: 0
            regionNetworkEgress: 0
            internetNetworkEgress: 0
        ui:
          enabled: false

runcmd:
  - [bash, -c, "/opt/bootstrap/bootstrap.sh 2>&1 | tee -a /var/log/bootstrap.log; exit ${PIPESTATUS[0]}"]

final_message: "bootstrap finished after $UPTIME s — check /var/lib/bootstrap/ready.json"
