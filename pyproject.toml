[project]
name = "cluster-doctor"
version = "0.1.0"
description = "Ariadne: a read-only Kubernetes cluster doctor served by self-hosted vLLM (course final project)"
requires-python = ">=3.11"
dependencies = [              # D-33: LangGraph orchestrates, LangChain supplies the tool and chat abstractions. Pinned exactly.
  "langgraph==1.2.12",
  "langchain-core==1.6.5",
  "langchain-openai==1.6.6",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
report = [                   # D-46: the analysis notebook only (make report); never installed by `uv sync` or CI
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S603", "S607", "S310", "E501"]   # subprocess to a pinned kubectl/aws/ccexplorer and urlopen to configured endpoints are the design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
