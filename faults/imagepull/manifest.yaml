apiVersion: v1
kind: Namespace
metadata:
  name: storefront
  labels:
    doctor.lab/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: nginx:1.299-alpine
