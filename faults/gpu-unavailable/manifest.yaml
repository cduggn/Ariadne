apiVersion: v1
kind: Namespace
metadata:
  name: embeddings
  labels:
    doctor.lab/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedder
  namespace: embeddings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedder
  template:
    metadata:
      labels:
        app: embedder
    spec:
      schedulerName: hami-scheduler
      containers:
        - name: embedder
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "sleep 3600"]
          resources:
            limits:
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "30000"
