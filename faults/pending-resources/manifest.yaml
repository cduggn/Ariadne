apiVersion: v1
kind: Namespace
metadata:
  name: ml
  labels:
    doctor.lab/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-trainer
  namespace: ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-trainer
  template:
    metadata:
      labels:
        app: ml-trainer
    spec:
      containers:
        - name: ml-trainer
          image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "64"
              memory: 1Gi
