apiVersion: v1
kind: Namespace
metadata:
  name: status
  labels:
    doctor.lab/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-page
  template:
    metadata:
      labels:
        app: status-page
    spec:
      containers:
        - name: status-page
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: status
spec:
  selector:
    app: status-page
  ports:
    - port: 80
      targetPort: 80
