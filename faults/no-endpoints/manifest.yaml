apiVersion: v1
kind: Namespace
metadata:
  name: checkout
  labels:
    doctor.lab/managed: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: checkout
spec:
  selector:
    app: checkout-v2
  ports:
    - port: 80
      targetPort: 80
