# govulncheck on the gateway (D-47): weekly and on demand, because it queries vuln.go.dev and a new advisory can
# appear without any change here. Not on every push, so an outside advisory can't block unrelated work.
name: vulncheck
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with: {go-version-file: gateway/go.mod, cache-dependency-path: gateway/go.sum}
      - run: make vulncheck
